        convert: "ovtool convert llm Qwen/Qwen3-1.7B -o ./qwen3-17b-int4-sym --weight-format int4 --sym"
        note: NPU-ready; measured ~16 tok/s on NPU 3720
      int4-awq-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-1.7B -o ./qwen3-17b-awq --weight-format int4 --awq"
      int8:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-1.7B -o ./qwen3-17b-int8 --weight-format int8"
      fp16:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-1.7B -o ./qwen3-17b-fp16 --weight-format fp16"

  - id: Qwen/Qwen3-4B
