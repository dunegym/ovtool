  - id: stabilityai/sd-turbo
    kind: image
    match: ["sd-turbo"]
    recommended_device: GPU
    variants:
      int8:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stabilityai/sd-turbo -o ./sd-turbo-int8 --weight-format int8"
        note: NPU segmented execution verified (--devices NPU,NPU,GPU; 4-step 512px ~12s warm cache)
      int4-g64:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stabilityai/sd-turbo -o ./sd-turbo-int4 --weight-format int4 --group-size 64"
        note: group 64 required — UNet channel size 320 is not divisible by 128; NPU segmented load not possible (int4 UNet fails Level0 compilation) — use int8 for --devices NPU,...

  - id: SimianLuo/LCM_Dreamshaper_v7
    kind: image
    match: ["lcm-dreamshaper"]
    recommended_device: GPU
    variants:
      int8:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image SimianLuo/LCM_Dreamshaper_v7 -o ./lcm-dreamshaper-int8 --weight-format int8"
        note: LCM-distilled, 8 steps suffice — 512px ~19s on iGPU
      int4-g64:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image SimianLuo/LCM_Dreamshaper_v7 -o ./lcm-dreamshaper-int4 --weight-format int4 --group-size 64"
        note: group 64 required — UNet channel size 320 is not divisible by 128

  - id: stable-diffusion-v1-5/stable-diffusion-v1-5
    kind: image
    match: ["sd-1.5", "stable-diffusion-v1-5"]
    recommended_device: GPU
    variants:
      int8:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stable-diffusion-v1-5/stable-diffusion-v1-5 -o ./sd15-int8 --weight-format int8"
        note: classic SD1.5 base — 20-step 512px ~47s on iGPU
      int4-g64:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stable-diffusion-v1-5/stable-diffusion-v1-5 -o ./sd15-int4 --weight-format int4 --group-size 64"
        note: group 64 required — UNet channel size 320 is not divisible by 128

  - id: segmind/SSD-1B
    kind: image
    match: ["ssd-1b"]
    recommended_device: GPU
    variants:
      int8:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image segmind/SSD-1B -o ./ssd1b-int8 --weight-format int8"
        note: SDXL-distilled, native 1024px — 25-step ~89s on iGPU; needs the dual-tokenizer export
      int4-g64:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image segmind/SSD-1B -o ./ssd1b-int4 --weight-format int4 --group-size 64"
        note: group 64 required — UNet channel size 320 is not divisible by 128

  - id: stabilityai/stable-diffusion-3.5-medium
    kind: image
    match: ["sd-3.5-medium", "sd3.5-medium", "stable-diffusion-3.5-medium"]
    recommended_device: GPU
    variants:
      int8:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stabilityai/stable-diffusion-3.5-medium -o ./sd35m-int8 --weight-format int8"
        note: MMDiT (2.5B) + T5-XXL encoder; gated repo — accept the license on the model page first; 1024px/28 steps ~3m22s on iGPU; needs the triple-tokenizer export
      int4-g64:
        devices: [GPU, CPU, AUTO]
        convert: "ovtool convert image stabilityai/stable-diffusion-3.5-medium -o ./sd35m-int4 --weight-format int4 --group-size 64"
        note: 1024px/28 steps ~3m36s on iGPU

# global rules, evaluated for every matched entry
global_rules:
  - when_device: NPU
    forbid_kind: image
    message: >-
      whole-pipeline diffusion on NPU is not supported (VAE decode is not
      NPU-capable); use segmented execution instead:
      ovtool image ... --devices NPU,NPU,GPU.
  - when_device: NPU
    forbid_kind: vlm
    message: >-
      VLM pipelines on NPU hung the driver in testing
      (ZE_RESULT_ERROR_DEVICE_LOST); run VLMs on CPU/GPU.
  - when_device: NPU
    require_quant: int4-sym-g128
    for_kinds: [llm]
    message: >-
      NPU requires symmetric INT4 weights; convert with
      'ovtool convert llm <model> --weight-format int4 --sym'.
