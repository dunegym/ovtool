# ovtool built-in model compatibility registry.
#
# Records models available from Hugging Face together with the verified
# (device x quantization x parameters) combinations, so that unusable
# inference configurations can be rejected before model load time.
#
# Fields per entry:
#   id            Hugging Face repo id
#   kind          llm | vlm | image
#   match         lowercase substrings used to associate a -m path/id with this entry
#   variants      quantization variants with their allowed devices
#                 (quant is auto-detected from the -m path: "sym" -> symmetric,
#                  "asym" -> asymmetric, "int8" -> int8, "fp16" -> fp16,
#                  "awq" -> activation-aware int4)
#   text_only     vlm only: image inputs are known-broken on current GenAI
#
# Every llm/vlm model below ships the full five-variant ladder:
# int4-asym-g128 / int4-sym-g128 / int4-awq-g128 / int8 / fp16
schema_version: 1

models:
  - id: Qwen/Qwen3-0.6B
    kind: llm
    match: ["qwen3-0.6b", "qwen3_0.6b"]
    variants:
      int4-asym-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-0.6B -o ./qwen3-06b-int4 --weight-format int4"
      int4-sym-g128:
        devices: [CPU, GPU, NPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-0.6B -o ./qwen3-06b-int4-sym --weight-format int4 --sym"
        note: NPU-ready (symmetric INT4); measured ~21 tok/s on NPU 3720
      int4-awq-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-0.6B -o ./qwen3-06b-awq --weight-format int4 --awq"
        note: ~40% faster than plain int4 on iGPU (78 vs 55 tok/s)
      int8:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-0.6B -o ./qwen3-06b-int8 --weight-format int8"
      fp16:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert llm Qwen/Qwen3-0.6B -o ./qwen3-06b-fp16 --weight-format fp16"

  - id: Qwen/Qwen3-1.7B
