        convert: "ovtool convert llm Qwen/Qwen3-4B -o ./qwen3-4b-fp16 --weight-format fp16"

  - id: Qwen/Qwen3.5-0.8B
    kind: vlm
    match: ["qwen3.5-0.8b", "qwen3_5-0.8b"]
    text_only: true
    variants:
      int4-asym-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert vlm Qwen/Qwen3.5-0.8B -o ./qwen35-08b-int4 --weight-format int4"
      int4-sym-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert vlm Qwen/Qwen3.5-0.8B -o ./qwen35-08b-int4-sym --weight-format int4 --sym"
      int4-awq-g128:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert vlm Qwen/Qwen3.5-0.8B -o ./qwen35-08b-awq --weight-format int4 --awq"
      int8:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert vlm Qwen/Qwen3.5-0.8B -o ./qwen35-08b-int8 --weight-format int8"
      fp16:
        devices: [CPU, GPU, AUTO]
        convert: "ovtool convert vlm Qwen/Qwen3.5-0.8B -o ./qwen35-08b-fp16 --weight-format fp16"

  - id: Qwen/Qwen3.5-2B
    kind: vlm
    match: ["qwen3.5-2b", "qwen3_5-2b"]
    text_only: true
