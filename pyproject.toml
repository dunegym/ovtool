[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovtool"
dynamic = ["version"]
description = "Comprehensive OpenVINO GenAI command-line tool: LLM/VLM inference, image generation, model conversion and quantization"
requires-python = ">=3.10"
dependencies = [
    "openvino>=2025.3",
    "openvino-genai>=2025.3",
    "openvino-tokenizers>=2025.3",
    "numpy",
    "pillow",
    "huggingface_hub",
    "pyyaml>=6",
    "sentencepiece",
    "tiktoken",
    "pypdf",
]

[project.optional-dependencies]
convert = ["optimum-intel[openvino]>=1.20", "onnx", "diffusers", "transformers"]
test = ["pytest>=8"]

[project.scripts]
ovtool = "ovtool.cli:main"

[tool.setuptools.packages.find]
include = ["ovtool*"]

[tool.setuptools.package-data]
ovtool = ["registry.yaml", "webui.html"]

[tool.setuptools.dynamic]
version = {attr = "ovtool.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
